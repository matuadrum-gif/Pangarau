<!doctype html><html lang="mi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ngā Hononga Tau ki te 1000</title><style>
body{font-family:Arial,sans-serif;background:#f5f8fb;color:#17324d;margin:0}main{max-width:950px;margin:auto;padding:24px}.card{background:white;border:1px solid #d9e2ea;border-radius:20px;padding:20px;margin:16px 0}h1{text-align:center;font-size:42px}.intro{text-align:center}.levels,.flash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button,input{font:inherit}button{min-height:55px;border:1px solid #ccd7e0;background:white;border-radius:14px;padding:10px;font-weight:bold;cursor:pointer}.active,.primary{background:#176b87;color:white}.q{text-align:center;font-size:58px;font-weight:bold;margin:28px}.answer{display:flex;gap:10px;max-width:430px;margin:auto}.answer input{min-width:0;flex:1;border:2px solid #ccd7e0;border-radius:14px;padding:12px;text-align:center;font-size:28px}.feedback{text-align:center;font-size:20px;font-weight:bold;min-height:30px;margin-top:12px}.score{text-align:right}.bar{height:28px;background:#edf1f4;border-radius:20px;overflow:hidden}.fill{height:100%;background:#76a9b9}.strategy{text-align:center;background:#e8f4f7;border-radius:12px;padding:14px;margin-top:12px;display:none}@media(max-width:650px){.levels,.flash{grid-template-columns:1fr 1fr}.answer{flex-direction:column}h1{font-size:32px}.q{font-size:42px}}
</style></head><body><main><h1>Ngā Hononga Tau ki te 1000</h1><p class="intro">Kimihia te tau e ngaro ana kia eke ki te <b>1000</b>.</p>
<div class="card"><div class="levels">
<button class="lev active" data-l="1">Taumata 1<br>Tipu Pāngarau<br>Ngā Rau</button><button class="lev" data-l="2">Taumata 2<br>Tipu Pāngarau<br>Ngā Rima Tekau</button><button class="lev" data-l="3">Taumata 3<br>Toki Pāngarau<br>Ngā Tekau</button><button class="lev" data-l="4">Taumata 4<br>Tohunga Pāngarau<br>Ngā Tahi</button>
</div></div>
<div class="card"><div class="score"><b id="s">0</b> tika · <b id="t">0</b> katoa</div><h2 id="title">Taumata 1 · Tipu Pāngarau</h2><p id="sub">Ngā Rau · Ka tatau mā te 100.</p><div style="display:flex;justify-content:space-between"><b>0</b><b id="mark">600</b><b>1000</b></div><div class="bar"><div id="fill" class="fill" style="width:60%"></div></div><div id="q" class="q">600 + ? = 1000</div><form id="f"><div class="answer"><input id="a" inputmode="numeric" placeholder="?" aria-label="Tō whakautu"><button class="primary">Tirohia</button></div></form><div id="fb" class="feedback"></div><div id="strat" class="strategy"></div><div style="text-align:center;margin-top:12px"><button id="next" style="display:none">He pātai anō →</button> <button id="reset">Tīmata anō</button></div></div>
<div class="card"><h2>Taumata 5 · Kāri Tere</h2><p>Kōwhiria te momo kāri. Ka puta tonu he pātai hou ina tika tō whakautu.</p><div class="flash"><button data-m="1">Ngā Rau</button><button data-m="2">Rima Tekau</button><button data-m="3">Ngā Tekau</button><button data-m="4">Ngā Tahi</button></div><p style="text-align:center"><button id="start" class="primary">Tīmata ngā Kāri</button></p><div id="fa" style="display:none"><div class="score"><b id="fs">0</b> tika · <b id="ft">0</b> katoa</div><div id="fq" class="q"></div><form id="ff"><div class="answer"><input id="fan" inputmode="numeric" placeholder="?" aria-label="Tō whakautu"><button class="primary">Tuku</button></div></form><div id="ffb" class="feedback"></div></div></div>
<script>
let l=1,n=600,s=0,t=0,locked=false,m=1,fn=0,fs=0,ft=0;const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];
const cfg={1:["Taumata 1 · Tipu Pāngarau","Ngā Rau · Ka tatau mā te 100."],2:["Taumata 2 · Tipu Pāngarau","Ngā Rima Tekau · Ka tatau mā te 50."],3:["Taumata 3 · Toki Pāngarau","Ngā Tekau · Ka tatau mā te 10."],4:["Taumata 4 · Tohunga Pāngarau","Ngā Tahi · Whakamahia he rautaki kia eke ki te 1000."]};
function gen(x){if(x==1)return Math.floor(Math.random()*11)*100;if(x==2)return Math.floor(Math.random()*21)*50;if(x==3)return Math.floor(Math.random()*101)*10;return Math.floor(Math.random()*1001)}
function nq(){locked=false;n=gen(l);$("#q").textContent=n+" + ? = 1000";$("#mark").textContent=n;$("#fill").style.width=(n/10)+"%";$("#a").value="";$("#fb").textContent="";$("#strat").style.display="none";$("#next").style.display="none";$("#a").focus()}
function bridge(x){if(x==0)return"0 → 1000 = 1000";if(x==1000)return"1000 → 1000 = 0";let c=x,p=[],sum=0,z=Math.ceil(c/10)*10;if(z>c){p.push(c+" → "+z+" = "+(z-c));sum+=z-c;c=z}let h=Math.ceil(c/100)*100;if(h>c){p.push(c+" → "+h+" = "+(h-c));sum+=h-c;c=h}if(c<1000){p.push(c+" → 1000 = "+(1000-c));sum+=1000-c}return p.join(" · ")+" → "+sum}
$$(".lev").forEach(b=>b.onclick=()=>{l=+b.dataset.l;$$(".lev").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#title").textContent=cfg[l][0];$("#sub").textContent=cfg[l][1];nq()});
$("#f").onsubmit=e=>{e.preventDefault();if(locked)return;let v=Number($("#a").value);if($("#a").value.trim()===""||!Number.isInteger(v)){ $("#fb").textContent="Tuhia he tau.";return}t++;$("#t").textContent=t;if(v===1000-n){s++;$("#s").textContent=s;$("#fb").textContent="Tika! Ka rawe! ✓";locked=true;if(l==4){$("#strat").textContent=bridge(n);$("#strat").style.display="block"}$("#next").style.display="inline-block"}else $("#fb").textContent="Whakamātauria anō."};
$("#next").onclick=nq;$("#reset").onclick=()=>{s=t=0;$("#s").textContent=$("#t").textContent=0;nq()};
$$(".flash button").forEach(b=>b.onclick=()=>{m=+b.dataset.m;$$(".flash button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
function nf(){fn=gen(m);$("#fq").textContent=fn+" + ? = 1000";$("#fan").value="";$("#ffb").textContent="";$("#fan").focus()}
$("#start").onclick=()=>{$("#fa").style.display="block";fs=ft=0;$("#fs").textContent=$("#ft").textContent=0;nf()};
$("#ff").onsubmit=e=>{e.preventDefault();let v=Number($("#fan").value);if($("#fan").value.trim()===""||!Number.isInteger(v))return;ft++;$("#ft").textContent=ft;if(v===1000-fn){fs++;$("#fs").textContent=fs;$("#ffb").textContent="Tika! ✓";setTimeout(nf,500)}else{$("#ffb").textContent="Whakamātauria anō.";$("#fan").select()}};
nq();
</script></main></body></html>
